
<svg width="100%" height="200" viewBox="0 0 1000 200"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10091f"/>
      <stop offset="100%" stop-color="#35145a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#bg)"/>

  <path fill="#9333ea" opacity=".35">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
      M0 120 Q250 50 500 120 T1000 120 V200 H0 Z;
      M0 100 Q250 160 500 100 T1000 100 V200 H0 Z;
      M0 120 Q250 50 500 120 T1000 120 V200 H0 Z"/>
  </path>

  <path fill="#7e22ce" opacity=".4">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
      M0 150 Q250 90 500 150 T1000 150 V200 H0 Z;
      M0 130 Q250 180 500 130 T1000 130 V200 H0 Z;
      M0 150 Q250 90 500 150 T1000 150 V200 H0 Z"/>
  </path>

  <text x="500" y="95" text-anchor="middle"
        fill="#eee5ff" font-family="monospace"
        font-size="32" font-weight="bold">
    Welcome to Mariana's Github &lt;/&gt;
  </text>
</svg>
